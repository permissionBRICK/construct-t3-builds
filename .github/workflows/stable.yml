name: Publish stable T3 pair
on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: stable-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - name: Test publisher decisions
        run: python3 -m unittest discover -s tests -v
      - name: Read public Construct source (no credentials)
        run: git clone --depth 1 --branch main https://github.com/permissionBRICK/The-Construct.git work/construct
      - name: Select stable version and compatible patch inventory
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publisher.py plan --repository "$GITHUB_REPOSITORY"
      - name: Restore reusable compiler and download caches
        if: steps.plan.outputs.build == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/.cargo/registry
            ~/.cargo/git
            work/compiler/resource-monitor
          key: t3-ubuntu24-node26-${{ hashFiles('work/plan.json') }}
          restore-keys: t3-ubuntu24-node26-
      - name: Build and test the matched pair
        if: steps.plan.outputs.build == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full
          sudo env "PATH=$PATH" "HOME=$HOME" bash scripts/build.sh "$PWD/work"
      - name: Make build caches readable to Actions
        if: always() && steps.plan.outputs.build == 'true'
        run: |
          for directory in "$HOME/.local/share/pnpm" "$HOME/.cache/electron" "$HOME/.cache/electron-builder" "$HOME/.cargo" work; do
            if [ -d "$directory" ]; then sudo chown -R "$(id -u):$(id -g)" "$directory"; fi
          done
      - name: Upload, verify, then publish the release
        if: steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publisher.py publish
      # Public scheduled workflows are disabled after 60 days without repository
      # activity. A monthly metadata commit keeps this artifacts-only repo active.
      # It is deliberately outside the binary recipe hash.
      - name: Keep the polling schedule active
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/keep-alive.py
