name: Publish T3 pairs
on:
  push:
    branches: [main]
  # A pull request runs the same plan, build and tests as a verification (it builds even an
  # already published pair and never publishes), so repair PRs are checked before they merge.
  pull_request:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('t3-verify-{0}', github.event.pull_request.number) || 't3-publisher' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, nightly]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - name: Test build and publisher contracts
        run: |
          python3 -m unittest discover -s tests -v
          node test/t3-source-transform.test.mjs
          node test/t3-source-contract.test.cjs
          node test/t3-build-cache.test.mjs
          node test/t3park-patch.test.mjs
          node test/t3-capacity-retry.test.mjs
          node extension/test/t3-opencode-monitor-patch.test.mjs
          bash test/t3-build-node.test.sh
          bash test/t3-build-diskcheck.test.sh
      - name: Select channel version and its patch inventory
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publisher.py plan --repository "$GITHUB_REPOSITORY" --channel "${{ matrix.channel }}" ${{ github.event_name == 'pull_request' && '--verify' || '' }}
      - name: A pull request must build its pair
        if: github.event_name == 'pull_request' && steps.plan.outputs.build != 'true'
        run: |
          python3 -c 'import json; print(json.load(open("work/plan.json")).get("reason", "the plan did not build"))'
          exit 1
      - name: Restore reusable compiler and download caches
        if: steps.plan.outputs.build == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/.cargo/registry
            ~/.cargo/git
            work/compiler/resource-monitor
          key: t3-ubuntu24-node26-${{ hashFiles('work/plan.json') }}
          restore-keys: t3-ubuntu24-node26-
      - name: Build and test the matched pair
        if: steps.plan.outputs.build == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full
          # A restored cache belongs to runner, but the builder/Wine run as root.
          # Wine refuses to create its prefix beneath a differently owned parent.
          sudo mkdir -p work/compiler
          sudo chown -R root:root work/compiler
          sudo env "PATH=$PATH" "HOME=$HOME" bash scripts/build.sh "$PWD/work"
      - name: Make build caches readable to Actions
        if: always() && steps.plan.outputs.build == 'true'
        run: |
          for directory in "$HOME/.local/share/pnpm" "$HOME/.cache/electron" "$HOME/.cache/electron-builder" "$HOME/.cargo" work; do
            if [ -d "$directory" ]; then sudo chown -R "$(id -u):$(id -g)" "$directory"; fi
          done
      - name: Upload, verify, then publish the release
        if: github.event_name != 'pull_request' && steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publisher.py publish
      # Public scheduled workflows are disabled after 60 days without repository
      # activity. A monthly metadata commit keeps this artifacts-only repo active.
      # It is deliberately outside the binary recipe hash.
      - name: Keep the polling schedule active
        if: ${{ !cancelled() && matrix.channel == 'stable' && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/keep-alive.py
